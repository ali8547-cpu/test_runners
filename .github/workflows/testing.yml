name: Temporary Test

on:
  workflow_dispatch:

jobs:
  run-test:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install Xray-core
        run: |
          curl -L https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip
          unzip xray.zip -d xray
          chmod +x xray/xray

      - name: Generate Xray config
        run: |
          V2RAY_UUID="${{ secrets.V2RAY_UUID }}"
          cat > xray/config.json << EOF
          {
            "inbounds": [{
              "port": 10086,
              "protocol": "vmess",
              "settings": {
                "clients": [{
                  "id": "$V2RAY_UUID",
                  "alterId": 0
                }]
              }
            }],
            "outbounds": [{
              "protocol": "freedom",
              "settings": {}
            }]
          }
          EOF

      - name: Start Xray
        run: ./xray/xray run -c xray/config.json &

      - name: Download and configure frpc
        run: |
          FRP_VER=$(curl -s https://api.github.com/repos/fatedier/frp/releases/latest | jq -r .tag_name)
          curl -L https://github.com/fatedier/frp/releases/download/${FRP_VER}/frp_${FRP_VER#v}_linux_amd64.tar.gz -o frp.tar.gz
          tar xzf frp.tar.gz
          cd frp_${FRP_VER#v}_linux_amd64
          cat > frpc.toml << EOF
          serverAddr = "${{ secrets.FRP_SERVER_ADDR }}"
          serverPort = ${{ secrets.FRP_SERVER_PORT }}
          auth.method = "token"
          auth.token = "${{ secrets.FRP_TOKEN }}"

          [[proxies]]
          name = "v2ray-tcp"
          type = "tcp"
          localIP = "127.0.0.1"
          localPort = 10086
          remotePort = ${{ secrets.FRP_REMOTE_PORT }}
          EOF
          echo "FRP_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Start frpc
        run: |
          cd ${{ env.FRP_DIR }}
          ./frpc -c frpc.toml
          sleep 3
          grep "start success" frpc.log || echo "Warning: frpc might have failed, check logs"
          cat frpc.log

      - name: Create V2Ray client config link
        run: |
          HOST="${{ secrets.FRP_SERVER_ADDR }}"
          PORT="${{ secrets.FRP_REMOTE_PORT }}"
          V2RAY_UUID="${{ secrets.V2RAY_UUID }}"
          CONFIG_JSON=$(cat <<EOM
          {
            "v": "2",
            "ps": "github-runner-frp",
            "add": "$HOST",
            "port": "$PORT",
            "id": "$V2RAY_UUID",
            "aid": "0",
            "net": "tcp",
            "type": "none",
            "host": "",
            "path": "",
            "tls": "none"
          }
          EOM
          )
          VMESS_LINK="vmess://$(echo -n $CONFIG_JSON | base64 -w0)"
          echo "========== V2Ray Config =========="
          echo "$VMESS_LINK"
          echo "=================================="

      - name: Keep alive
        run: |
          echo "test is running. Cancel workflow to stop."
          while true; do sleep 60; done
